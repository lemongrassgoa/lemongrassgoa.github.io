
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartet Media Library</title>

<style>
:root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --blue: #58a6ff;
    --green: #238636;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

header {
    padding: 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

header h2 { margin: 0; }

.container {
    max-width: 1250px;
    margin: 25px auto;
    padding: 0 18px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

input, select, button {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
}

input {
    flex: 1;
    min-width: 180px;
}

button {
    background: var(--green);
    border: none;
    cursor: pointer;
}

button:hover { opacity: .85; }

.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 20px 0;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px 20px;
    flex: 1;
    min-width: 120px;
}

.stat strong {
    display: block;
    font-size: 24px;
    margin-bottom: 5px;
}

.stat small, .muted {
    color: var(--muted);
}

.layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 550px;
}

.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
}

.sidebar-header, .viewer-header {
    padding: 15px;
    border-bottom: 1px solid var(--border);
    font-weight: bold;
}

.file-list {
    max-height: 700px;
    overflow-y: auto;
}

.file {
    padding: 13px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.file:hover, .file.active {
    background: #21262d;
}

.file small {
    display: block;
    color: var(--muted);
    margin-top: 6px;
}

.viewer {
    min-width: 0;
}

.viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    overflow-wrap: anywhere;
}

.viewer-header a {
    color: var(--blue);
    font-size: 12px;
}

#preview {
    padding: 15px;
}

#preview iframe {
    width: 100%;
    height: 650px;
    border: none;
    background: white;
}

#preview video {
    width: 100%;
    max-height: 650px;
    background: black;
}

.placeholder {
    padding: 70px 15px;
    text-align: center;
    color: var(--muted);
}

.status {
    color: var(--muted);
    font-size: 12px;
    margin: 12px 0;
}

@media(max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--border); }
    .file-list { max-height: 350px; }
}
</style>
</head>

<body>

<header>
    <h2>🎬 Quartet Media Library</h2>
</header>

<div class="container">

    <div class="toolbar">
        <input
            id="search"
            placeholder="Search files or folders..."
            oninput="renderFiles()"
        >

        <select id="typeFilter" onchange="renderFiles()">
            <option value="all">All files</option>
            <option value=".mp4">Videos only</option>
            <option value=".pdf">PDFs only</option>
        </select>

        <button onclick="loadIndex()">↻ Refresh</button>
    </div>

    <div class="stats">
        <div class="stat">
            <strong id="totalCount">0</strong>
            <small>Total files</small>
        </div>

        <div class="stat">
            <strong id="videoCount">0</strong>
            <small>Videos</small>
        </div>

        <div class="stat">
            <strong id="pdfCount">0</strong>
            <small>PDFs</small>
        </div>
    </div>

    <div class="status" id="status">
        Loading media index...
    </div>

    <div class="layout">

        <div class="sidebar">
            <div class="sidebar-header">
                📁 Quartet Media Files
            </div>

            <div class="file-list" id="fileList">
                <div class="placeholder">Loading...</div>
            </div>
        </div>

        <div class="viewer">

            <div class="viewer-header">
                <span id="fileTitle">Media Preview</span>
                <a id="openLink" target="_blank" hidden>
                    Open original ↗
                </a>
            </div>

            <div id="preview">
                <div class="placeholder">
                    Select a video or PDF to preview.
                </div>
            </div>

        </div>

    </div>

</div>

<script>

const INDEX_URL = "./quartet/media-index.json";

let files = [];
let selectedIndex = -1;

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

function formatSize(bytes) {
    if (!bytes) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576)
        return (bytes / 1024).toFixed(1) + " KB";

    return (bytes / 1048576).toFixed(1) + " MB";
}

async function loadIndex() {

    const status = document.getElementById("status");

    status.textContent = "Loading media index...";

    try {

        const response = await fetch(
            INDEX_URL + "?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(
                "Media index unavailable: HTTP " +
                response.status
            );
        }

        const data = await response.json();

        files = data.files || [];

        selectedIndex = -1;

        document.getElementById("totalCount").textContent =
            data.total ?? files.length;

        document.getElementById("videoCount").textContent =
            files.filter(f => f.extension === ".mp4").length;

        document.getElementById("pdfCount").textContent =
            files.filter(f => f.extension === ".pdf").length;

        status.textContent =
            `Repository: ${data.repository} | ` +
            `Last generated: ${new Date(data.generatedAt).toLocaleString()}`;

        document.getElementById("fileTitle").textContent =
            "Media Preview";

        document.getElementById("openLink").hidden = true;

        document.getElementById("preview").innerHTML =
            '<div class="placeholder">Select a media file.</div>';

        renderFiles();

    } catch (error) {

        status.textContent = error.message;

        document.getElementById("fileList").innerHTML =
            `<div class="placeholder">${escapeHTML(error.message)}</div>`;

    }
}

function renderFiles() {

    const search = document.getElementById("search")
        .value.toLowerCase();

    const type = document.getElementById("typeFilter").value;

    const filtered = files
        .map((file, index) => ({ ...file, index }))
        .filter(file => {

            const matchesSearch =
                file.path.toLowerCase().includes(search);

            const matchesType =
                type === "all" || file.extension === type;

            return matchesSearch && matchesType;

        });

    const list = document.getElementById("fileList");

    if (!filtered.length) {
        list.innerHTML =
            '<div class="placeholder">No matching files found.</div>';
        return;
    }

    list.innerHTML = filtered.map(file => {

        const icon = file.extension === ".mp4"
            ? "🎬" : "📕";

        return `
            <div class="file ${selectedIndex === file.index ? "active" : ""}"
                 data-index="${file.index}"
                 onclick="openFile(${file.index})">

                ${icon} ${escapeHTML(file.name)}

                <small>${escapeHTML(file.path)}</small>

                <small>${formatSize(file.size)}</small>

            </div>
        `;

    }).join("");
}

function openFile(index) {

    const file = files[index];

    if (!file) return;

    selectedIndex = index;

    const preview = document.getElementById("preview");

    document.getElementById("fileTitle").textContent =
        file.name;

    const openLink = document.getElementById("openLink");

    openLink.href = file.page;
    openLink.hidden = false;

    if (file.extension === ".mp4") {

        preview.innerHTML = `
            <video controls autoplay preload="metadata">
                <source
                    src="${escapeHTML(file.url)}"
                    type="video/mp4">
                Your browser cannot play this video.
            </video>
        `;

    } else if (file.extension === ".pdf") {

        preview.innerHTML = `
            <iframe
                src="${escapeHTML(file.url)}"
                title="${escapeHTML(file.name)}">
            </iframe>
        `;

    }

    renderFiles();
}

// Initial load
loadIndex();

</script>

</body>
</html>
