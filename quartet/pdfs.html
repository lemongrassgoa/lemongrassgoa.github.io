<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartet Media</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0d1117;
  color: #e6edf3;
  font: 14px Arial, sans-serif;
}
header {
  padding: 14px 18px;
  border-bottom: 1px solid #30363d;
  font-size: 17px;
  font-weight: 600;
}
main {
  max-width: 1100px;
  margin: 18px auto;
  padding: 0 14px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.search {
  flex: 1;
  min-width: 180px;
  padding: 9px 11px;
  color: inherit;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 5px;
}
button {
  padding: 9px 12px;
  color: inherit;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 5px;
  cursor: pointer;
}
button.active {
  background: #30363d;
  border-color: #8b949e;
}
button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.layout {
  display: grid;
  grid-template-columns: minmax(220px, 340px) 1fr;
  min-height: 65vh;
  border: 1px solid #30363d;
  border-radius: 6px;
  overflow: hidden;
}
.files {
  background: #161b22;
  border-right: 1px solid #30363d;
  overflow-y: auto;
  max-height: 75vh;
}
.file {
  padding: 5px;
  border-bottom: 1px solid #30363d;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.file:hover, .file.active { background: #21262d; }
.file small {
  display: block;
  margin-top: 5px;
  color: #8b949e;
}
.viewer { min-width: 0; }
.viewer-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 13px;
  border-bottom: 1px solid #30363d;
  overflow-wrap: anywhere;
}
#fileTitle { min-width: 0; overflow-wrap: anywhere; }
#preview { padding: 12px; }
#preview video {
  width: 100%;
  max-height: 70vh;
  background: black;
}
#preview .pdf-viewer-frame {
  display: block;
  width: 100%;
  height: 75vh;
  min-height: 520px;
  border: 0;
  background: #525659;
}
#pdfPages {
  display: grid;
  justify-items: center;
  gap: 12px;
}
#pdfPages canvas {
  display: block;
  max-width: 100%;
  height: auto;
  background: white;
}
.message {
  padding: 28px 12px;
  color: #8b949e;
  text-align: center;
}
.status {
  min-height: 18px;
  margin: 0 0 10px;
  color: #8b949e;
  font-size: 12px;
}
@media (max-width: 700px) {
  .layout { grid-template-columns: 1fr; }
  .files {
    max-height: 32vh;
    border-right: 0;
    border-bottom: 1px solid #30363d;
  }
}
</style>
</head>

<body>
<header>Quartet Media</header>

<main>
  <div class="toolbar">
    <button id="pdfButton" class="active" type="button" onclick="setType('.pdf')">PDF</button>
    <button id="mp4Button" type="button" onclick="setType('.mp4')">MP4</button>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search files…"
      oninput="renderFiles()"
      aria-label="Search files"
    >
    <button id="downloadButton" type="button" onclick="downloadSelected()" disabled>Download</button>
  </div>

  <div id="status" class="status" aria-live="polite">Loading media index…</div>

  <div class="layout">
    <div class="files" id="fileList">
      <div class="message">Loading…</div>
    </div>

    <section class="viewer">
      <div class="viewer-title">
        <span id="fileTitle">Select a file</span>
      </div>
      <div id="preview">
        <div class="message">Choose a PDF or MP4 file.</div>
      </div>
    </section>
  </div>
</main>

<script>
const INDEX_URL = "media-index.json";
const PDF_VIEWER_URL =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist-viewer-min@3.11.174/build/minified/web/viewer.html";

let files = [];
let selectedPath = "";
let selectedType = ".pdf";
let currentPdfLoadingTask = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function formatSize(bytes) {
  if (!bytes) return "0 B";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

/*
 * Only include files inside a direct child folder of quartet
 * whose folder name begins with "pdfs_".
 *
 * Example included:
 * quartet/pdfs_programme/file.pdf
 * quartet/pdfs_programme/subfolder/video.mp4
 *
 * Example excluded:
 * quartet/videos/file.mp4
 * quartet/file.pdf
 */
function isInPdfsFolder(file) {
  const parts = String(file.path || "").split("/");
  return parts.length >= 3 &&
         parts[0] === "quartet" &&
         parts[1].startsWith("pdfs_");
}

async function loadIndex() {
  const status = document.getElementById("status");
  status.textContent = "Loading media index…";

  try {
    const response = await fetch(INDEX_URL + "?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Media index unavailable (HTTP " + response.status + ").");
    }

    const data = await response.json();

    files = (data.files || []).filter(file =>
      isInPdfsFolder(file) &&
      [".pdf", ".mp4"].includes(String(file.extension).toLowerCase())
    );

    selectedPath = "";
    document.getElementById("downloadButton").disabled = true;
    document.getElementById("fileTitle").textContent = "Select a file";
    document.getElementById("preview").innerHTML =
      '<div class="message">Choose a PDF or MP4 file.</div>';

    renderFiles();
    status.textContent = files.length + " files in pdfs_ folders";
  } catch (error) {
    status.textContent = error.message;
    document.getElementById("fileList").innerHTML =
      '<div class="message">' + escapeHTML(error.message) + '</div>';
  }
}

function setType(type) {
  selectedType = type;
  selectedPath = "";

  document.getElementById("pdfButton").classList.toggle("active", type === ".pdf");
  document.getElementById("mp4Button").classList.toggle("active", type === ".mp4");
  document.getElementById("downloadButton").disabled = true;
  document.getElementById("fileTitle").textContent = "Select a file";
  document.getElementById("preview").innerHTML =
    '<div class="message">Choose a ' + (type === ".pdf" ? "PDF" : "MP4") + ' file.</div>';

  renderFiles();
}

function renderFiles() {
  const query = document.getElementById("search").value.trim().toLowerCase();

  const filtered = files.filter(file =>
    String(file.extension).toLowerCase() === selectedType &&
    String(file.path).toLowerCase().includes(query)
  );

  const list = document.getElementById("fileList");

  if (!filtered.length) {
    list.innerHTML = '<div class="message">No matching ' +
      (selectedType === ".pdf" ? "PDF" : "MP4") + ' files.</div>';
    return;
  }

//  list.innerHTML = filtered.map(file => `
//    <div class="file ${selectedPath === file.path ? "active" : ""}"
//         data-path="${escapeHTML(file.path)}"
//         onclick="openFileByPath('${escapeHTML(file.path).replace(/&#39;/g, "\\'")}')">
//      ${escapeHTML(file.name)}
//      <small>${escapeHTML(file.path)} · ${formatSize(file.size)}</small>
//    </div>
//  `).join("");
  list.innerHTML = filtered.map(file => `
    <div class="file ${selectedPath === file.path ? "active" : ""}"
         data-path="${escapeHTML(file.path)}"
         onclick="openFileByPath('${escapeHTML(file.path).replace(/&#39;/g, "\\'")}')">
      ${escapeHTML(file.name)}
    </div>
  `).join("");
}

function openFileByPath(path) {
  const file = files.find(item => item.path === path);
  if (file) openFile(file);
}

async function openFile(file) {
  selectedPath = file.path;
  document.getElementById("fileTitle").textContent = file.name;
  document.getElementById("downloadButton").disabled = false;
  renderFiles();

  const preview = document.getElementById("preview");
  preview.innerHTML = '<div class="message">Loading…</div>';

  if (currentPdfLoadingTask) {
    try { await currentPdfLoadingTask.destroy(); } catch (_) {}
    currentPdfLoadingTask = null;
  }

  if (file.extension.toLowerCase() === ".mp4") {
    preview.innerHTML = `
      <video controls autoplay preload="metadata">
        <source src="${escapeHTML(file.url)}" type="video/mp4">
        Your browser cannot play this video.
      </video>`;
    return;
  }

  if (file.extension.toLowerCase() === ".pdf") {
    const viewerUrl = PDF_VIEWER_URL + "?file=" + encodeURIComponent(file.url);
    preview.innerHTML = `
      <iframe
        class="pdf-viewer-frame"
        src="${escapeHTML(viewerUrl)}"
        title="PDF viewer: ${escapeHTML(file.name)}"
        loading="eager">
      </iframe>`;
  }
}

async function downloadSelected() {
  const file = files.find(item => item.path === selectedPath);
  if (!file) return;

  const button = document.getElementById("downloadButton");
  const status = document.getElementById("status");
  button.disabled = true;
  status.textContent = "Preparing download…";

  try {
    const response = await fetch(file.url);
    if (!response.ok) throw new Error("Download failed (HTTP " + response.status + ").");

    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = objectUrl;
    link.download = file.name;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    status.textContent = "Download started";
  } catch (error) {
    status.textContent = error.message;
    // Fallback: open the raw file if the browser blocks the download fetch.
    window.open(file.url, "_blank", "noopener");
  } finally {
    button.disabled = false;
  }
}

loadIndex();
</script>
</body>
</html>
