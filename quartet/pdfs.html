
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Filtered Repository Explorer</title>

<style>
body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.controls {
    display: grid;
    grid-template-columns: 2fr 2fr 1fr auto;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    min-width: 0;
    padding: 12px;
    background: #161b22;
    color: white;
    border: 1px solid #30363d;
    border-radius: 6px;
}

button {
    padding: 12px 20px;
    background: #238636;
    color: white;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
}

button:hover { background: #2ea043; }

.info {
    color: #8b949e;
    margin: 15px 0;
    font-size: 13px;
}

.file-list {
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
}

.file {
    display: flex;
    justify-content: space-between;
    padding: 13px 15px;
    border-bottom: 1px solid #30363d;
    cursor: pointer;
    font-size: 13px;
    gap: 15px;
}

.file:hover { background: #161b22; }

.file-path {
    overflow-wrap: anywhere;
}

.file-size {
    color: #8b949e;
    white-space: nowrap;
}

.viewer {
    margin-top: 20px;
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
}

.viewer-header {
    padding: 12px 15px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
}

pre {
    padding: 15px;
    overflow: auto;
    max-height: 600px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
}

.placeholder {
    padding: 40px;
    text-align: center;
    color: #8b949e;
}

.error { color: #f85149; }

@media(max-width: 750px) {
    .controls { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <h2>🐙 GitHub Filtered Explorer</h2>
</header>

<div class="container">

    <div class="controls">
        <input id="repo" value="lemongrassgoa/lemongrassgoa.github.io"
               placeholder="owner/repository">

        <input id="folder" value="quartets"
               placeholder="Subfolder path">

        <input id="extension" value=".pdf"
               placeholder=".js">

        <button onclick="startSearch()">Search</button>
    </div>

    <div class="info" id="status">
        Configure your repository, subfolder and file type.
    </div>

    <div class="file-list" id="files">
        <div class="placeholder">
            Matching files will appear here.
        </div>
    </div>

    <div class="viewer">
        <div class="viewer-header" id="fileTitle">
            File Preview
        </div>

        <div id="preview">
            <div class="placeholder">
                Select a file to view its contents.
            </div>
        </div>
    </div>

</div>

<script>
const API = "https://api.github.com";

let owner = "";
let repository = "";
let branch = "";
let extension = "";
let allFiles = [];
let selectedFile = null;

async function apiFetch(url) {
    const response = await fetch(url);

    if (!response.ok) {
        if (response.status === 403)
            throw new Error("GitHub API rate limit exceeded.");

        if (response.status === 404)
            throw new Error("Repository or folder not found.");

        throw new Error("GitHub API error: " + response.status);
    }

    return response.json();
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576)
        return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
}

async function startSearch() {
    try {
        const repoValue = document.getElementById("repo")
            .value.trim()
            .replace(/^https?:\/\/github\.com\//, "")
            .replace(/\/$/, "")
            .replace(/\.git$/, "");

        const parts = repoValue.split("/");

        if (parts.length !== 2)
            throw new Error("Enter a valid owner/repository.");

        owner = parts[0];
        repository = parts[1];

        const folder = document.getElementById("folder")
            .value.trim().replace(/^\/+|\/+$/g, "");

        extension = document.getElementById("extension")
            .value.trim().toLowerCase();

        if (!extension)
            throw new Error("Enter a file extension.");

        if (!extension.startsWith("."))
            extension = "." + extension;

        allFiles = [];

        document.getElementById("files").innerHTML =
            '<div class="placeholder">Scanning repository...</div>';

        document.getElementById("preview").innerHTML = "";
        document.getElementById("fileTitle").textContent =
            "File Preview";

        const info = await apiFetch(
            `${API}/repos/${owner}/${repository}`
        );

        branch = info.default_branch;

        await scanFolder(folder);

        allFiles.sort((a, b) =>
            a.path.localeCompare(b.path)
        );

        renderFiles();

        document.getElementById("status").textContent =
            `${allFiles.length} matching files found in ${folder || "repository root"} (${extension})`;

    } catch (error) {
        showError(error.message);
    }
}

async function scanFolder(path) {
    const encodedPath = path
        ? path.split("/").map(encodeURIComponent).join("/")
        : "";

    const url =
        `${API}/repos/${owner}/${repository}/contents/${encodedPath}` +
        `?ref=${encodeURIComponent(branch)}`;

    const entries = await apiFetch(url);

    if (!Array.isArray(entries))
        throw new Error("Specified path is not a folder.");

    for (const entry of entries) {

        if (entry.type === "dir") {
            await scanFolder(entry.path);
        }

        else if (
            entry.type === "file" &&
            entry.name.toLowerCase().endsWith(extension)
        ) {
            allFiles.push({
                name: entry.name,
                path: entry.path,
                size: entry.size,
                download_url: entry.download_url
            });

            document.getElementById("status").textContent =
                `Scanning... ${allFiles.length} matching files found`;
        }
    }
}

function renderFiles() {
    const container = document.getElementById("files");

    if (!allFiles.length) {
        container.innerHTML =
            '<div class="placeholder">No matching files found.</div>';
        return;
    }

    container.innerHTML = allFiles.map((file, index) => `
        <div class="file" onclick="openFile(${index})">
            <span class="file-path">
                📄 ${escapeHTML(file.path)}
            </span>
            <span class="file-size">
                ${formatSize(file.size)}
            </span>
        </div>
    `).join("");
}

async function openFile(index) {
    try {
        const file = allFiles[index];

        selectedFile = file;

        document.getElementById("fileTitle").textContent =
            file.path;

        document.getElementById("preview").innerHTML =
            '<div class="placeholder">Loading file...</div>';

        // Download raw file content
        const response = await fetch(file.download_url);

        if (!response.ok)
            throw new Error("Unable to download file.");

        const content = await response.text();

        document.getElementById("preview").innerHTML =
            `<pre>${escapeHTML(content)}</pre>`;

    } catch (error) {
        showError(error.message);
    }
}

function showError(message) {
    document.getElementById("files").innerHTML =
        `<div class="placeholder error">${escapeHTML(message)}</div>`;

    document.getElementById("status").textContent = "Search failed.";
}

// Run automatically on load
startSearch();
</script>

</body>
</html>
